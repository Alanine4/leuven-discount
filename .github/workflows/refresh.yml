name: 每周刷新折扣

on:
  schedule:
    # AH/ALDI 周一、Carrefour 周二或周三、Lidl/Colruyt 周三、Lidl/ALDI 周末档周四上线；周一到周四每天早 7 点（比利时时间）各跑一次。UTC 时间
    - cron: '0 5 * * 1-4'
    # Colruyt 的每日 dump 大约 12:46 UTC 才落到 bucket，早上那趟只能拿到前一天的货。
    # 下午 16 点（比利时时间）再跑一趟，把 Colruyt 当天的 dump 补上。
    - cron: '0 14 * * 1-4'
  workflow_dispatch:        # 也可以在 GitHub 页面上手动点一下就跑

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      # AH 的 Akamai 只放行有头浏览器，CI 上得有个虚拟显示才起得来。
      # --with-deps 装的是浏览器自身的依赖，不含 xvfb，所以单独装一次。
      - run: sudo apt-get install -y xvfb

      - name: 抓取
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm run scrape

      - name: 出页面
        run: npm run build

      - name: 补中文名（没配 API key 就自动跳过）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate.js && npm run build

      - name: 提交数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public lib/glossary.json
          git diff --staged --quiet || git commit -m "折扣数据刷新 $(date +%F)"
          git push

      - name: 抓取结果摘要
        if: always()
        run: cat data/raw/_report.json >> $GITHUB_STEP_SUMMARY
