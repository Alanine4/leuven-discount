<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="鲁汶各大超市本周折扣汇总，中文关键词可搜">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0F1216" media="(prefers-color-scheme:dark)">
<title>鲁汶折扣雷达</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============ Ledger Blue · 色彩 token ============ */
:root{
  --blue-600:#1D5FD1; --blue-700:#164BA8; --blue-100:#EAF1FC; --blue-200:#CFDFF8;
  --gray-0:#FFFFFF; --gray-50:#F7F8FA; --gray-100:#EEF0F3; --gray-200:#E1E4E9;
  --gray-300:#C9CED6; --gray-400:#9AA3B0; --gray-500:#656E7A; --gray-600:#4C545F;
  --gray-700:#343A43; --gray-800:#20242B; --gray-900:#12151A;

  --bg:var(--gray-50); --surface:var(--gray-0); --surface-hover:var(--gray-50);
  --text:var(--gray-900); --text-2:var(--gray-600); --text-3:var(--gray-500);
  --line:var(--gray-200);
  --primary:var(--blue-600); --primary-hover:var(--blue-700);
  --on-primary:#FFFFFF;
  --tint:var(--blue-100); --tint-line:var(--blue-200);

  --font:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1216; --surface:#171B21; --surface-hover:#1D222A;
    --text:#EDEFF2; --text-2:#A6ADB8; --text-3:#7C8592;
    --line:#262C35;
    --primary:#5B8DEB; --primary-hover:#7AA3F0;
    --on-primary:#0F1216;
    --tint:rgba(91,141,235,.10); --tint-line:rgba(91,141,235,.32);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#171B21; --surface-hover:#1D222A;
  --text:#EDEFF2; --text-2:#A6ADB8; --text-3:#7C8592;
  --line:#262C35;
  --primary:#5B8DEB; --primary-hover:#7AA3F0;
  --on-primary:#0F1216;
  --tint:rgba(91,141,235,.10); --tint-line:rgba(91,141,235,.32);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 48px}
.num{font-variant-numeric:tabular-nums}

/* ============ Icon system ============ */
.ic,.ic-sm{flex:none;display:inline-block;vertical-align:-.15em;color:var(--text-3)}
.ic{width:20px;height:20px}
.ic-sm{width:16px;height:16px}

/* ============ 页头 ============ */
header.top{padding:32px 0 0}
.kicker{font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-3)}
h1{font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-.01em;
  margin:8px 0 8px;text-wrap:balance}
.sub{margin:0;font-size:14px;color:var(--text-2);max-width:60ch}
.sub a{color:inherit;text-underline-offset:2px}

/* ============ 统计条 ============ */
.stats{display:flex;margin-top:24px}
.stat{flex:1;min-width:0;padding:0 12px;border-left:1px solid var(--line)}
.stat:first-child{padding-left:0;border-left:0}
.stat:last-child{padding-right:0}
.stat b{display:block;font-size:20px;font-weight:600;line-height:1.3;
  font-variant-numeric:tabular-nums;color:var(--text)}
.stat span{display:block;font-size:12px;line-height:1.35;color:var(--text-3)}

/* ============ 搜索 ============ */
.searchbar{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:16px 0 12px;margin-top:24px;border-bottom:1px solid var(--line)}
.field{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px 0 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  transition:border-color 120ms ease,box-shadow 120ms ease}
.field:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--tint)}
.field:focus-within .ic{color:var(--primary)}
#q{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--text);
  font-family:var(--font);font-size:16px;line-height:1.45;padding:0}
#q::placeholder{color:var(--text-3)}
#q::-webkit-search-cancel-button{display:none}
#clear{display:none;border:0;background:none;color:var(--text-3);cursor:pointer;
  padding:4px;border-radius:var(--r);transition:color 120ms ease,background-color 120ms ease}
#clear svg{display:block;width:20px;height:20px}
#clear:hover{color:var(--text);background:var(--surface-hover)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;
  scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border:1px solid var(--line);
  background:var(--surface);color:var(--text-2);border-radius:999px;
  font-family:var(--font);font-size:13px;line-height:1;cursor:pointer;white-space:nowrap;
  transition:color 120ms ease,background-color 120ms ease,border-color 120ms ease}
.chip:hover{color:var(--text);border-color:var(--gray-300)}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--tint-line);
  color:var(--primary)}
.chip .n{font-size:12px;margin-left:4px;color:var(--text-3);
  font-variant-numeric:tabular-nums}

/* ============ 控件行 ============ */
.controls{display:flex;align-items:center;gap:8px;padding:12px 0 0;flex-wrap:wrap}
.sel{position:relative;display:inline-flex}
.sel select{appearance:none;-webkit-appearance:none;height:36px;
  padding:0 32px 0 12px;max-width:12.5rem;
  font-family:var(--font);font-size:13px;line-height:1;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  cursor:pointer;text-overflow:ellipsis;
  transition:border-color 120ms ease}
.sel select:hover{border-color:var(--gray-300)}
.sel .chev{position:absolute;right:8px;top:50%;margin-top:-10px;pointer-events:none}
.sel:hover .chev{color:var(--text)}
.count{margin-left:auto;font-size:12px;color:var(--text-3);
  font-variant-numeric:tabular-nums}

/* ============ 结果列表 ============ */
ul.list{list-style:none;margin:16px 0 0;padding:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden}
ul.list:empty{display:none}
li.row{display:grid;grid-template-columns:1fr auto;gap:0 16px;align-items:start;
  padding:12px 16px}
li.row+li.row{border-top:1px solid var(--line)}
.info{min-width:0}
.nm{font-size:14px;font-weight:500;line-height:1.4;color:var(--text);overflow-wrap:anywhere}
.nm a{color:inherit;text-decoration:none;transition:color 120ms ease}
.nm a:hover{color:var(--primary)}
.nm a:hover .ext{color:var(--primary)}
.ext{margin-left:2px}
.orig{font-size:12px;line-height:1.4;color:var(--text-3);overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:0 8px;align-items:center;margin-top:8px;
  font-size:12px;line-height:1.5;color:var(--text-2)}
.tag{font-weight:500;color:var(--text-2)}
.cat{display:inline-flex;align-items:center;gap:4px}
.cat .ic-sm{color:inherit}
.dot{color:var(--gray-300)}
.deal{background:var(--tint);color:var(--text-2);border-radius:var(--r);padding:1px 6px}
.price{text-align:right;white-space:nowrap}
.pp{display:block;font-size:16px;font-weight:600;line-height:1.4;color:var(--text);
  font-variant-numeric:tabular-nums}
.po{font-size:12px;color:var(--text-3);text-decoration:line-through;
  font-variant-numeric:tabular-nums}
.only{font-size:12px;color:var(--text-3)}
.price-sub{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:4px}
.flash{display:inline-flex;align-items:center;gap:3px;
  padding:1px 6px;border:1px solid transparent;border-radius:var(--r);
  font-size:12px;font-weight:500;line-height:1.5;
  background:var(--tint);color:var(--primary);font-variant-numeric:tabular-nums}
.flash.big{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.flash.unc{background:none;color:var(--text-3);border-color:var(--line);
  font-weight:400;cursor:help}
.flash.unc .ic-sm{color:inherit}

.empty{padding:48px 16px;text-align:center;color:var(--text-2)}
.empty b{display:block;font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px}
#more{display:block;width:100%;margin-top:12px;height:40px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  color:var(--text-2);font-family:var(--font);font-size:13px;cursor:pointer;
  transition:color 120ms ease,background-color 120ms ease,border-color 120ms ease}
#more:hover{background:var(--surface-hover);color:var(--text);border-color:var(--gray-300)}

/* ============ 页脚 ============ */
footer{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);
  font-size:12px;line-height:1.6;color:var(--text-3)}
footer p{margin:0 0 8px}
footer h3{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);margin:0 0 12px}
footer a{display:inline-flex;align-items:center;gap:4px;color:var(--text-2);
  text-decoration:none;transition:color 120ms ease}
footer a:hover{color:var(--primary)}
footer a:hover .ext{color:var(--primary)}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px 16px;margin:0 0 24px}

:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){
  .wrap{padding:0 12px 48px}
  .stat{padding:0 8px}
  li.row{padding:12px;gap:0 12px}
  .sel select{max-width:9.5rem}
  .price-sub{flex-wrap:wrap}
}
</style>
</head>
<body>


<div class="wrap">
<header class="top">
  <div class="kicker">Leuven · 每周超市传单</div>
  <h1>这周哪里在打折</h1>
  <p class="sub" id="sub"></p>
  <div class="stats" id="stats"></div>
</header>

<div class="searchbar">
  <div class="field">
    <svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2 17 17"/></svg>
    <input id="q" type="search" placeholder="搜商品：意面、鸡肉、牛奶、洗衣液…" autocomplete="off" enterkeyhint="search">
    <button id="clear" aria-label="清空搜索">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 8 8"/><path d="m14 6-8 8"/></svg>
    </button>
  </div>
  <div class="chips" id="quick"></div>
</div>

<div class="controls">
  <div class="sel">
    <select id="store" aria-label="按超市筛选"></select>
    <svg class="ic chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 8.5 4 4 4-4"/></svg>
  </div>
  <div class="sel">
    <select id="cat" aria-label="按品类筛选"></select>
    <svg class="ic chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 8.5 4 4 4-4"/></svg>
  </div>
  <div class="sel">
    <select id="sort" aria-label="排序方式">
      <option value="pct">折扣力度 ↓</option>
      <option value="cheap">价格 ↑</option>
      <option value="store">按超市</option>
    </select>
    <svg class="ic chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 8.5 4 4 4-4"/></svg>
  </div>
  <span class="count" id="count"></span>
</div>

<ul class="list" id="list"></ul>
<button id="more" hidden>显示更多</button>

<footer>
  <h3>数据来源 · 可点开核对</h3>
  <div class="srcgrid" id="srclinks"></div>
  <p>数据每周一、周三从各超市官网自动抓取更新。Carrefour 数据来自全国线上促销目录，鲁汶只有 Market 和 Express 店型，个别商品店里可能没有；Colruyt 价格按门店浮动，页面上的价格可能和鲁汶店差几分钱。「第二件半价」这类多件优惠显示的是单件价，折扣力度按实际优惠折算，以店内标签为准。</p>
  <p id="stamp"></p>
</footer>
</div>

const STORE_LABEL = {"Lidl":"Lidl","Colruyt":"大仓库 Colruyt","Carrefour":"家乐福 Carrefour",
                "Carrefour Market":"家乐福 Market","Carrefour Express":"家乐福 Express",
                "ALDI":"ALDI","Albert Heijn":"AH 阿尔伯特","Delhaize":"大黑狮 Delhaize"};
const SRC = {
 "Lidl":"https://www.lidl.be/l/nl-BE/folder",
 "Colruyt":"https://www.colruyt.be/nl/acties",
 "Carrefour":"https://www.carrefour.be/nl/al-onze-promoties",
 "Carrefour Market":"https://www.carrefour.be/nl/al-onze-market-promoties",
 "Carrefour Express":"https://www.carrefour.be/nl/al-onze-express-promoties",
 "ALDI":"https://www.aldi.be/aanbiedingen.html",
 "Albert Heijn":"https://www.ah.be/bonus",
 "Delhaize":"https://www.delhaize.be/nl"
};
const QUICK = ["意面","鸡肉","牛奶","鸡蛋","奶酪","面包","三文鱼","水果","咖啡","啤酒","洗衣液","冷冻"];

const $ = s => document.querySelector(s);
const euro = n => "€" + n.toFixed(2);
const storeZhOf = {};
ITEMS.forEach(i => { if (!storeZhOf[i.store]) storeZhOf[i.store] = i.store_zh; });
const storeLabel = s => STORE_LABEL[s] || storeZhOf[s] || s;
const CN_COUNT = ["","一","两","三","四","五","六","七"];
let shown = 60, state = {q:"", store:"", cat:"", sort:"pct"};

/* ---------- stat strip ---------- */
const deep = ITEMS.filter(i => i.pct && i.pct >= 50).length;
$("#stats").innerHTML = [
  [META.total, "件本周促销"],
  [META.with_pct, "件标了折扣"],
  [deep, "件五折起"],
  [META.updated.slice(5), "更新"]
].map(([b,s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
$("#stamp").textContent = `本页数据抓取于 ${META.updated}，共 ${META.total} 条。每周传单换新后会自动刷新。`;
const storeKeys = Object.keys(META.stores);
$("#sub").textContent = `${storeKeys.map(storeLabel).join("、")} ${CN_COUNT[storeKeys.length] || storeKeys.length}家本周促销商品全收录。搜中文就行——输入「意面」也能搜到 pasta、spaghetti、Barilla。`;
$("#srclinks").innerHTML = storeKeys.filter(k => SRC[k])
  .map(k => `<a href="${SRC[k]}" target="_blank" rel="noopener">${esc(storeLabel(k))}${IC_EXT}</a>`).join("");

/* ---------- filter selects ---------- */
const byCount = o => Object.entries(o).sort((a,b) => b[1]-a[1]);
$("#store").innerHTML = `<option value="">全部超市</option>` +
  byCount(META.stores).map(([k,v]) => `<option value="${k}">${esc(storeLabel(k))} (${v})</option>`).join("");
$("#cat").innerHTML = `<option value="">全部品类</option>` +
  byCount(META.cats).map(([k,v]) => `<option value="${k}">${k} (${v})</option>`).join("");
$("#quick").innerHTML = QUICK.map(t =>
  `<button class="chip" data-t="${t}" aria-pressed="false">${t}</button>`).join("");

/* ---------- search ---------- */
const CJK = /[一-鿿]/;
function terms(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  return q.split(/[\s,，、]+/).filter(Boolean).map(t => {
    const alts = [t];
    const exact = SYN[t];
    if (exact) {
      alts.push(...exact);
    } else {
      for (const [zh, en] of Object.entries(SYN)) {
        if (zh.includes(t) || t.includes(zh)) alts.push(...en);
      }
    }
    return alts.map(a => a.toLowerCase());
  });
}
function hit(text, alt){
  // 中文按包含匹配；拉丁词按词首匹配，避免「pasta」命中「tandpasta」（牙膏）
  if (CJK.test(alt)) return text.includes(alt);
  return new RegExp("\\b" + alt.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(text);
}
const PET_WORDS = ["kat","hond","chat","chien","dier","pet","huisdier"];
function isPetQuery(q, T){
  if (/[猫狗宠]/.test(q)) return true;
  return T.some(alts => alts.some(a => PET_WORDS.some(p => a.includes(p))));
}
function filtered(){
  const T = terms(state.q);
  const excludePets = state.q.trim() && !state.cat && !isPetQuery(state.q, T);
  return ITEMS.filter(i => {
    if (state.store && i.store !== state.store) return false;
    if (state.cat && i.cat !== state.cat) return false;
    if (excludePets && i.cat === "宠物") return false;
    return T.every(alts => alts.some(a => hit(i.q, a)));
  }).sort((a,b) => {
    if (state.sort === "cheap") {
      const pa = a.pp ?? a.po ?? 1e9, pb = b.pp ?? b.po ?? 1e9;
      return pa - pb;
    }
    if (state.sort === "store") return a.store_zh.localeCompare(b.store_zh,"zh") || (b.pct||0)-(a.pct||0);
    const rank = x => (x.unc ? 0 : x.pct || 0);   // 存疑的折扣按"未知"处理，不占榜首
    return rank(b) - rank(a) || (a.pp ?? 1e9) - (b.pp ?? 1e9);
  });
}
function card(i){
  const price = i.pp ?? i.po;
  // 「第二件半价」「2+2 免费」这类，传单标的是整组价，不能当普通划线原价用
  const hasBoth = i.po && i.pp && i.po > i.pp && !i.mb;
  const flash = i.pct
    ? (i.unc
        ? `<span class="flash unc" title="传单只给了整组价，这个折扣是按整组价算的，实际以店内标签为准">${IC_INFO}约 -${i.pct}%</span>`
        : `<span class="flash${i.pct >= 50 ? " big" : ""}">-${i.pct}%</span>`)
    : "";
  const nm = esc(i.name_zh);
  // 纯百分比文案（如 -65%）和右侧折扣徽章信息重复，徽章存在时就不再重复展示
  const dtIsPurePct = i.dt && /^-\d+([.,]\d+)?%$/.test(i.dt.replace(/\s+/g, ""));
  const showDt = i.dt && !(dtIsPurePct && flash);
  return `<li class="row">
    <div class="info">
      <div class="nm">${i.url ? `<a href="${i.url}" target="_blank" rel="noopener">${nm}${IC_EXT}</a>` : nm}</div>
      ${i.name && i.name !== i.name_zh ? `<div class="orig">${esc(i.name)}</div>` : ""}
      <div class="meta">
        <span class="tag">${esc(storeLabel(i.store))}</span>
        <span class="dot">·</span><span class="cat">${CAT_ICON[i.cat] || ""}${esc(i.cat)}</span>
        ${showDt ? `<span class="deal">${esc(i.dt)}</span>` : ""}
        ${i.val ? `<span class="dot">·</span><span>${esc(i.val)}</span>` : ""}
      </div>
    </div>
    <div class="price">
      <span class="pp">${price != null ? euro(price) : "—"}</span>
      <span class="price-sub">
        ${hasBoth ? `<span class="po">${euro(i.po)}</span>`
                  : `<span class="only">${i.mb ? "整组价" : "促销价"}</span>`}
        ${flash}
      </span>
    </div>
  </li>`;
}
function esc(s){ return String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const r = filtered();
  $("#count").textContent = `${r.length} 件`;
  if (!r.length) {
    $("#list").innerHTML = `<div class="empty"><b>这周没有「${esc(state.q)}」的折扣</b>
      换个说法试试，比如「面条」「pasta」，或者清掉筛选看看别的品类。</div>`;
    $("#more").hidden = true;
    return;
  }
  $("#list").innerHTML = r.slice(0, shown).map(card).join("");
  $("#more").hidden = r.length <= shown;
  $("#more").textContent = `显示更多（还有 ${r.length - shown} 件）`;
}
function set(patch){ Object.assign(state, patch); shown = 60; render(); }

$("#q").addEventListener("input", e => {
  $("#clear").style.display = e.target.value ? "block" : "none";
  document.querySelectorAll("#quick .chip").forEach(c =>
    c.setAttribute("aria-pressed", c.dataset.t === e.target.value));
  set({q: e.target.value});
});
$("#clear").addEventListener("click", () => {
  $("#q").value = ""; $("#clear").style.display = "none";
  document.querySelectorAll("#quick .chip").forEach(c => c.setAttribute("aria-pressed","false"));
  set({q:""}); $("#q").focus();
});
$("#quick").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const on = b.getAttribute("aria-pressed") === "true";
  document.querySelectorAll("#quick .chip").forEach(c => c.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed", String(!on));
  $("#q").value = on ? "" : b.dataset.t;
  $("#clear").style.display = on ? "none" : "block";
  set({q: on ? "" : b.dataset.t});
});
$("#store").addEventListener("change", e => set({store: e.target.value}));
$("#cat").addEventListener("change", e => set({cat: e.target.value}));
$("#sort").addEventListener("change", e => set({sort: e.target.value}));
$("#more").addEventListener("click", () => { shown += 80; render(); });

render();
</script>
