<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="鲁汶各大超市本周折扣汇总，中文关键词可搜">
<meta name="theme-color" content="#EFEEE8">
<title>鲁汶折扣雷达</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo+Narrow:wght@500;700&display=swap">
<style>
:root{
  --paper:#EFEEE8; --surface:#FFFFFF; --surface-2:#F7F6F1;
  --ink:#1A1915; --ink-2:#5C584C; --ink-3:#8B8578;
  --line:#DCD9CE; --line-2:#C9C5B6;
  --flash:#F2B705; --flash-ink:#1A1915;
  --deep:#C8102E; --good:#3D7A3D;
  --s-colruyt:#D4482A; --s-delhaize:#2F3E46; --s-carrefour:#1B5FA8;
  --s-aldi:#3C7DC4; --s-lidl:#E0A800; --s-ah:#00ADE6; --s-other:#7A7264;
  --shadow:0 1px 2px rgba(26,25,21,.06);
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --num:"Archivo Narrow","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141310; --surface:#1D1B17; --surface-2:#242118;
    --ink:#F0EEE6; --ink-2:#B4AE9E; --ink-3:#847E70;
    --line:#302C24; --line-2:#413C31;
    --flash:#F2B705; --flash-ink:#141310;
    --deep:#FF5C72; --good:#7FBF7F;
    --s-colruyt:#F0724F; --s-delhaize:#8FA9B4; --s-carrefour:#6BA8E8;
    --s-aldi:#7FB4E8; --s-lidl:#F2C23E; --s-ah:#5DD3F5; --s-other:#9C9384;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#141310; --surface:#1D1B17; --surface-2:#242118;
  --ink:#F0EEE6; --ink-2:#B4AE9E; --ink-3:#847E70;
  --line:#302C24; --line-2:#413C31;
  --flash:#F2B705; --flash-ink:#141310;
  --deep:#FF5C72; --good:#7FBF7F;
  --s-colruyt:#F0724F; --s-delhaize:#8FA9B4; --s-carrefour:#6BA8E8;
  --s-aldi:#7FB4E8; --s-lidl:#F2C23E; --s-ah:#5DD3F5; --s-other:#9C9384;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 64px}

/* ---- masthead ---- */
header.top{padding:22px 0 14px}
.kicker{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);
  line-height:1.02;margin:6px 0 8px;letter-spacing:-.02em;text-wrap:balance}
h1 .hl{background:linear-gradient(transparent 62%,var(--flash) 62%,var(--flash) 92%,transparent 92%)}
.sub{color:var(--ink-2);font-size:13.5px;max-width:56ch}
.sub a{color:inherit;text-underline-offset:2px}

/* ---- stat strip ---- */
.stats{display:flex;gap:0;margin:16px 0 0;border:1px solid var(--line);
  border-radius:3px;background:var(--surface);overflow:hidden}
.stat{flex:1;padding:9px 10px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--num);font-weight:700;font-size:19px;
  line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--ink-3);letter-spacing:.03em}

/* ---- search ---- */
.searchbar{position:sticky;top:0;z-index:20;background:var(--paper);
  padding:12px 0 8px;margin-top:14px;border-bottom:1px solid var(--line)}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1.5px solid var(--line-2);border-radius:3px;padding:0 10px;box-shadow:var(--shadow)}
.field:focus-within{border-color:var(--flash)}
.field svg{flex:none;color:var(--ink-3)}
#q{flex:1;border:0;background:none;outline:none;color:var(--ink);
  font-family:var(--body);font-size:16px;padding:11px 0}
#q::placeholder{color:var(--ink-3)}
#clear{border:0;background:none;color:var(--ink-3);font-size:19px;cursor:pointer;
  padding:4px 2px;line-height:1;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;
  scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  font-family:var(--body)}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-family:var(--num);font-size:11px;opacity:.6;margin-left:4px;
  font-variant-numeric:tabular-nums}

/* ---- controls row ---- */
.controls{display:flex;align-items:center;gap:8px;padding:9px 0 2px;flex-wrap:wrap}
select{font-family:var(--body);font-size:12.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:3px;padding:6px 8px;cursor:pointer}
.count{margin-left:auto;font-family:var(--num);font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}

/* ---- results ---- */
ul.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
li.row{display:grid;grid-template-columns:4px 1fr auto;gap:0 11px;align-items:center;
  background:var(--surface);padding:11px 12px 11px 0}
li.row .bar{grid-row:1;align-self:stretch;background:var(--s-other);min-height:38px}
li.row.s-colruyt .bar{background:var(--s-colruyt)}
li.row.s-delhaize .bar{background:var(--s-delhaize)}
li.row.s-carrefour .bar{background:var(--s-carrefour)}
li.row.s-aldi .bar{background:var(--s-aldi)}
li.row.s-lidl .bar{background:var(--s-lidl)}
li.row.s-ah .bar{background:var(--s-ah)}
.info{min-width:0}
.nm{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.nm a{color:inherit;text-decoration:none}
.nm a:hover{text-decoration:underline}
.orig{font-family:var(--num);font-size:12px;color:var(--ink-3);line-height:1.35;
  overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px;
  font-size:11px;color:var(--ink-2)}
.tag{font-family:var(--num);font-weight:700;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2)}
.dot{color:var(--line-2)}
.deal{font-family:var(--num);font-weight:700;font-size:11px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:2px;padding:1px 5px}
.price{text-align:right;white-space:nowrap;padding-left:6px}
.pp{font-family:var(--num);font-weight:700;font-size:20px;line-height:1.05;
  font-variant-numeric:tabular-nums;display:block}
.po{font-family:var(--num);font-size:12px;color:var(--ink-3);text-decoration:line-through;
  font-variant-numeric:tabular-nums}
.only{font-family:var(--num);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.flash{display:inline-block;font-family:var(--num);font-weight:700;font-size:12.5px;
  background:var(--flash);color:var(--flash-ink);border-radius:2px;padding:1px 5px;
  margin-top:3px;font-variant-numeric:tabular-nums}
.flash.big{background:var(--deep);color:#fff}
.flash.unc{background:none;color:var(--ink-3);border:1px dashed var(--line-2);font-weight:500;cursor:help}
.empty{text-align:center;padding:44px 16px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--display);font-size:18px;margin-bottom:6px;color:var(--ink)}
#more{display:block;width:100%;margin-top:12px;padding:11px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:3px;color:var(--ink);font-family:var(--body);
  font-size:13.5px;cursor:pointer}
#more:hover{background:var(--surface-2)}

/* ---- footer ---- */
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3);line-height:1.65}
footer a{color:var(--ink-2);text-underline-offset:2px}
footer h3{font-family:var(--num);font-weight:700;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;margin:0 0 14px}
:focus-visible{outline:2px solid var(--flash);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){
  li.row{padding-right:10px;gap:0 9px}
  .pp{font-size:18px}
}
</style>
<style>
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>


<div class="wrap">
<header class="top">
  <div class="kicker">Leuven · 每周超市传单</div>
  <h1>这周<span class="hl">哪里在打折</span></h1>
  <p class="sub" id="sub"></p>
  <div class="stats" id="stats"></div>
</header>

<div class="searchbar">
  <div class="field">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
    <input id="q" type="search" placeholder="搜商品：意面、鸡肉、牛奶、洗衣液…" autocomplete="off" enterkeyhint="search">
    <button id="clear" aria-label="清空搜索">×</button>
  </div>
  <div class="chips" id="quick"></div>
</div>

<div class="controls">
  <select id="store"></select>
  <select id="cat"></select>
  <select id="sort">
    <option value="pct">折扣力度 ↓</option>
    <option value="cheap">价格 ↑</option>
    <option value="store">按超市</option>
  </select>
  <span class="count" id="count"></span>
</div>

<ul class="list" id="list"></ul>
<button id="more" hidden>显示更多</button>

<footer>
  <h3>数据来源 · 可点开核对</h3>
  <div class="srcgrid" id="srclinks"></div>
  <p>数据每周一、周三从各超市官网自动抓取更新。Carrefour 数据来自全国线上促销目录，鲁汶只有 Market 和 Express 店型，个别商品店里可能没有；Colruyt 价格按门店浮动，页面上的价格可能和鲁汶店差几分钱。「第二件半价」这类多件优惠显示的是单件价，折扣力度按实际优惠折算，以店内标签为准。</p>
  <p id="stamp"></p>
</footer>
</div>

<script>
const DATA = /*__DATA__*/;
const ITEMS = DATA.items, META = DATA.meta;

/* 中文 → 荷/法/英 关键词扩展，让搜「意面」也能命中 pasta / spaghetti */
const SYN = {
 "意面":["pasta","spaghetti","penne","fusilli","tagliatelle","lasagne","macaroni","noedel","nouille","pâtes","pate"],
 "意大利面":["pasta","spaghetti","penne","fusilli","tagliatelle","lasagne"],
 "面条":["pasta","noedel","nouille","spaghetti"],
 "米":["rijst","riz","rice"],"大米":["rijst","riz","rice"],
 "鸡肉":["kip","poulet","chicken","kipfilet"],"鸡":["kip","poulet","chicken"],
 "鸡翅":["kipvleugel","vleugel","wings"],"鸡蛋":["ei","eieren","oeuf","egg"],
 "牛肉":["rund","rundsgehakt","beef","boeuf","steak"],"肉末":["gehakt","haché"],
 "猪肉":["varken","porc","pork","spek"],"香肠":["worst","saucisse","chipolata","knacki"],
 "火腿":["ham","jambon"],"培根":["spek","bacon","lard"],
 "鱼":["vis","poisson","fish"],"三文鱼":["zalm","saumon","salmon"],
 "虾":["garnaal","garnalen","crevette","scampi"],"贻贝":["mossel","moules"],"金枪鱼":["tonijn","thon"],
 "牛奶":["melk","lait","milk"],"酸奶":["yoghurt","yaourt","skyr"],
 "奶酪":["kaas","fromage","cheese","gouda","feta","mozzarella","brie"],
 "黄油":["boter","beurre","butter"],"奶油":["room","crème","slagroom"],
 "面包":["brood","pain","bread","baguette","stokbrood"],"吐司":["toast","brood"],
 "羊角面包":["croissant","viennoiserie"],
 "蔬菜":["groente","légume","salade"],"水果":["fruit","vrucht"],
 "土豆":["aardappel","patat","frites","pomme de terre"],"西红柿":["tomaat","tomate","tomaten"],
 "番茄":["tomaat","tomate","tomaten"],"洋葱":["ui","uien","oignon"],"胡萝卜":["wortel","carotte"],
 "生菜":["sla","salade","kropsla"],"蘑菇":["champignon","paddenstoel"],
 "苹果":["appel","pomme"],"香蕉":["banaan","banane","chiquita"],"葡萄":["druif","druiven","raisin"],
 "西瓜":["watermeloen","pastèque","meloen"],"草莓":["aardbei","fraise"],"橙子":["sinaasappel","orange"],
 "咖啡":["koffie","café","espresso","nespresso","dolce gusto"],"茶":["thee","thé","tea"],
 "啤酒":["bier","bière","pils","jupiler","stella","leffe","duvel"],
 "红酒":["rode wijn","wijn","vin","rouge"],"白酒":["witte wijn","wijn","vin blanc"],
 "酒":["wijn","bier","vin","bière","whisky","vodka","gin"],
 "水":["water","eau","bruis","plat"],"果汁":["sap","jus","juice","fruitsap"],
 "可乐":["cola","coca"],"汽水":["frisdrank","soda","limonade"],
 "巧克力":["chocolade","chocolat","chocolade","milka","cote d'or","tony"],
 "饼干":["koek","koekje","biscuit","cookie","wafel"],"薯片":["chips","lay's","crisps"],
 "冰淇淋":["ijs","glace","magnum","ola"],"糖果":["snoep","bonbon","candy"],
 "坚果":["noot","noten","noix","amandel"],
 "油":["olie","huile","olijfolie"],"糖":["suiker","sucre"],"盐":["zout","sel"],
 "酱":["saus","sauce","pesto","mayonaise","ketchup"],"酱油":["sojasaus","soja"],
 "洗衣液":["wasmiddel","lessive","dreft","persil","ariel"],
 "洗发水":["shampoo","shampooing"],"沐浴露":["douchegel","douche","dove"],
 "牙膏":["tandpasta","dentifrice","colgate","oral-b","signal"],
 "纸巾":["papier","doekjes","keukenrol","zakdoek","toiletpapier"],
 "卫生纸":["toiletpapier","papier toilette"],
 "尿布":["luier","pampers","couche"],"猫粮":["kattenvoeding","kat","chat"],"狗粮":["hondenvoeding","hond"],
 "冷冻":["diepvries","diepgevroren","surgelé"],"披萨":["pizza"],"速食":["maaltijd","bereide"],
 "豆腐":["tofu"],"豆浆":["sojadrink","soja","alpro"]
};

const SCLASS = {"Colruyt":"s-colruyt","Delhaize":"s-delhaize","Carrefour":"s-carrefour",
                "ALDI":"s-aldi","Lidl":"s-lidl","Albert Heijn":"s-ah"};
const STORE_LABEL = {"Lidl":"Lidl","Colruyt":"大仓库 Colruyt","Carrefour":"家乐福 Carrefour",
                "ALDI":"ALDI","Albert Heijn":"AH 阿尔伯特","Delhaize":"大黑狮 Delhaize"};
const SRC = {
 "Lidl":"https://www.lidl.be/",
 "Colruyt":"https://www.colruyt.be/nl",
 "Carrefour":"https://www.carrefour.be/nl/al-onze-promoties",
 "ALDI":"https://www.aldi.be/aanbiedingen.html",
 "Albert Heijn":"https://www.ah.be/",
 "Delhaize":"https://www.delhaize.be/nl"
};
const QUICK = ["意面","鸡肉","牛奶","鸡蛋","奶酪","面包","三文鱼","水果","咖啡","啤酒","洗衣液","冷冻"];

const $ = s => document.querySelector(s);
const euro = n => "€" + n.toFixed(2);
const storeZhOf = {};
ITEMS.forEach(i => { if (!storeZhOf[i.store]) storeZhOf[i.store] = i.store_zh; });
const storeLabel = s => STORE_LABEL[s] || storeZhOf[s] || s;
const CN_COUNT = ["","一","两","三","四","五","六","七"];
let shown = 60, state = {q:"", store:"", cat:"", sort:"pct"};

/* ---------- stat strip ---------- */
const deep = ITEMS.filter(i => i.pct && i.pct >= 50).length;
$("#stats").innerHTML = [
  [META.total, "件本周促销"],
  [META.with_pct, "件标了折扣"],
  [deep, "件五折起"],
  [META.updated.slice(5), "更新"]
].map(([b,s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
$("#stamp").textContent = `本页数据抓取于 ${META.updated}，共 ${META.total} 条。每周传单换新后会自动刷新。`;
const storeKeys = Object.keys(META.stores);
$("#sub").textContent = `${storeKeys.map(storeLabel).join("、")} ${CN_COUNT[storeKeys.length] || storeKeys.length}家本周促销商品全收录。搜中文就行——输入「意面」也能搜到 pasta、spaghetti、Barilla。`;
$("#srclinks").innerHTML = storeKeys.filter(k => SRC[k])
  .map(k => `<a href="${SRC[k]}" target="_blank" rel="noopener">${esc(storeLabel(k))} ↗</a>`).join("");

/* ---------- filter selects ---------- */
const byCount = o => Object.entries(o).sort((a,b) => b[1]-a[1]);
$("#store").innerHTML = `<option value="">全部超市</option>` +
  byCount(META.stores).map(([k,v]) => `<option value="${k}">${esc(storeLabel(k))} (${v})</option>`).join("");
$("#cat").innerHTML = `<option value="">全部品类</option>` +
  byCount(META.cats).map(([k,v]) => `<option value="${k}">${k} (${v})</option>`).join("");
$("#quick").innerHTML = QUICK.map(t =>
  `<button class="chip" data-t="${t}" aria-pressed="false">${t}</button>`).join("");

/* ---------- search ---------- */
const CJK = /[一-鿿]/;
function terms(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  return q.split(/[\s,，、]+/).filter(Boolean).map(t => {
    const alts = [t];
    const exact = SYN[t];
    if (exact) {
      alts.push(...exact);
    } else {
      for (const [zh, en] of Object.entries(SYN)) {
        if (zh.includes(t) || t.includes(zh)) alts.push(...en);
      }
    }
    return alts.map(a => a.toLowerCase());
  });
}
function hit(text, alt){
  // 中文按包含匹配；拉丁词按词首匹配，避免「pasta」命中「tandpasta」（牙膏）
  if (CJK.test(alt)) return text.includes(alt);
  return new RegExp("\\b" + alt.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(text);
}
const PET_WORDS = ["kat","hond","chat","chien","dier","pet","huisdier"];
function isPetQuery(q, T){
  if (/[猫狗宠]/.test(q)) return true;
  return T.some(alts => alts.some(a => PET_WORDS.some(p => a.includes(p))));
}
function filtered(){
  const T = terms(state.q);
  const excludePets = state.q.trim() && !state.cat && !isPetQuery(state.q, T);
  return ITEMS.filter(i => {
    if (state.store && i.store !== state.store) return false;
    if (state.cat && i.cat !== state.cat) return false;
    if (excludePets && i.cat === "宠物") return false;
    return T.every(alts => alts.some(a => hit(i.q, a)));
  }).sort((a,b) => {
    if (state.sort === "cheap") {
      const pa = a.pp ?? a.po ?? 1e9, pb = b.pp ?? b.po ?? 1e9;
      return pa - pb;
    }
    if (state.sort === "store") return a.store_zh.localeCompare(b.store_zh,"zh") || (b.pct||0)-(a.pct||0);
    const rank = x => (x.unc ? 0 : x.pct || 0);   // 存疑的折扣按"未知"处理，不占榜首
    return rank(b) - rank(a) || (a.pp ?? 1e9) - (b.pp ?? 1e9);
  });
}
function card(i){
  const price = i.pp ?? i.po;
  // 「第二件半价」「2+2 免费」这类，传单标的是整组价，不能当普通划线原价用
  const hasBoth = i.po && i.pp && i.po > i.pp && !i.mb;
  const flash = i.pct
    ? (i.unc
        ? `<span class="flash unc" title="传单只给了整组价，这个折扣是按整组价算的，实际以店内标签为准">约 -${i.pct}%</span>`
        : `<span class="flash${i.pct >= 50 ? " big" : ""}">-${i.pct}%</span>`)
    : "";
  const nm = esc(i.name_zh);
  return `<li class="row ${SCLASS[i.store]||""}">
    <div class="bar"></div>
    <div class="info">
      <div class="nm">${i.url ? `<a href="${i.url}" target="_blank" rel="noopener">${nm}</a>` : nm}</div>
      ${i.name && i.name !== i.name_zh ? `<div class="orig">${esc(i.name)}</div>` : ""}
      <div class="meta">
        <span class="tag">${esc(storeLabel(i.store))}</span>
        <span class="dot">·</span><span>${esc(i.cat)}</span>
        ${i.dt ? `<span class="deal">${esc(i.dt)}</span>` : ""}
        ${i.val ? `<span class="dot">·</span><span>${esc(i.val)}</span>` : ""}
      </div>
    </div>
    <div class="price">
      <span class="pp">${price != null ? euro(price) : "—"}</span>
      ${hasBoth ? `<span class="po">${euro(i.po)}</span>`
                : `<span class="only">${i.mb ? "整组价" : "促销价"}</span>`}
      ${flash ? `<br>${flash}` : ""}
    </div>
  </li>`;
}
function esc(s){ return String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const r = filtered();
  $("#count").textContent = `${r.length} 件`;
  if (!r.length) {
    $("#list").innerHTML = `<div class="empty"><b>这周没有「${esc(state.q)}」的折扣</b>
      换个说法试试，比如「面条」「pasta」，或者清掉筛选看看别的品类。</div>`;
    $("#more").hidden = true;
    return;
  }
  $("#list").innerHTML = r.slice(0, shown).map(card).join("");
  $("#more").hidden = r.length <= shown;
  $("#more").textContent = `显示更多（还有 ${r.length - shown} 件）`;
}
function set(patch){ Object.assign(state, patch); shown = 60; render(); }

$("#q").addEventListener("input", e => {
  $("#clear").style.display = e.target.value ? "block" : "none";
  document.querySelectorAll("#quick .chip").forEach(c =>
    c.setAttribute("aria-pressed", c.dataset.t === e.target.value));
  set({q: e.target.value});
});
$("#clear").addEventListener("click", () => {
  $("#q").value = ""; $("#clear").style.display = "none";
  document.querySelectorAll("#quick .chip").forEach(c => c.setAttribute("aria-pressed","false"));
  set({q:""}); $("#q").focus();
});
$("#quick").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const on = b.getAttribute("aria-pressed") === "true";
  document.querySelectorAll("#quick .chip").forEach(c => c.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed", String(!on));
  $("#q").value = on ? "" : b.dataset.t;
  $("#clear").style.display = on ? "none" : "block";
  set({q: on ? "" : b.dataset.t});
});
$("#store").addEventListener("change", e => set({store: e.target.value}));
$("#cat").addEventListener("change", e => set({cat: e.target.value}));
$("#sort").addEventListener("change", e => set({sort: e.target.value}));
$("#more").addEventListener("click", () => { shown += 80; render(); });

render();
</script>

</body>
</html>
